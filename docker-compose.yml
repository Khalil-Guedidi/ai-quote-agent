services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quote-agent-postgres
    environment:
      POSTGRES_USER: quote_agent
      POSTGRES_PASSWORD: quote_agent_secret
      POSTGRES_DB: quote_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
