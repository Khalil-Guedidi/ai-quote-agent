services:
  app:
    build: .
    container_name: quote-agent-app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE__URL: postgresql+asyncpg://quote_agent:quote_agent_secret@postgres:5432/quote_agent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: quote-agent-postgres
    environment:
      POSTGRES_USER: quote_agent
      POSTGRES_PASSWORD: quote_agent_secret
      POSTGRES_DB: quote_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
