services:
  app:
    build: .
    container_name: quote-agent-app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE__URL: postgresql+asyncpg://quote_agent:quote_agent_secret@postgres:5432/quote_agent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    container_name: quote-agent-postgres
    environment:
      POSTGRES_USER: quote_agent
      POSTGRES_PASSWORD: quote_agent_secret
      POSTGRES_DB: quote_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Odoo (ERP for catalog ingestion) ──────────────────────────────────────
  odoo:
    image: odoo:17.0
    container_name: quote-agent-odoo
    ports:
      - "8069:8069"
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo_secret
    depends_on:
      odoo-db:
        condition: service_healthy
    volumes:
      - odoo-data:/var/lib/odoo

  odoo-db:
    image: postgres:16
    container_name: quote-agent-odoo-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_secret
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - odoo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  odoo-data:
  odoo-pgdata:
