name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quote_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE__URL: postgresql+asyncpg://test:test@localhost:5432/quote_agent_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Enable pgvector extension
        run: PGPASSWORD=test psql -h localhost -U test -d quote_agent_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Install dependencies (without ML deps)
        run: uv sync --locked --no-group ml

      - name: Ruff lint
        run: uv run --no-group ml ruff check src/ tests/

      - name: Ruff format check
        run: uv run --no-group ml ruff format --check src/ tests/

      - name: mypy strict
        run: uv run --no-group ml mypy src/

      - name: Unit tests with coverage
        run: uv run --no-group ml pytest tests/unit/ --cov=quote_agent --cov-report=term-missing

      - name: Integration tests
        run: uv run --no-group ml pytest tests/integration/ -v

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: docker build -t quote-agent:ci .
